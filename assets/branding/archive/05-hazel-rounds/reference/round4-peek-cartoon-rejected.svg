<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Simple Money Tools — Hazel the squirrel peeking over a pound coin" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>Simple Money Tools — Hazel the squirrel peeking over a pound coin</title>
